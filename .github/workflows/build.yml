# SPDX-License-Identifier: GPL-2.0-or-later
name: Build & Audit (Linux x86_64 + Windows x64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Native Linux x86_64 (Ubuntu 22.04 / glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Vulkan, SDL3, LLVM & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build patchelf pkg-config python3 \
            glslang-dev spirv-tools libvulkan-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev \
            xvfb xauth mesa-vulkan-drivers fonts-dejavu-core

      - name: Bootstrap & patch XboxXBERecomp SDK
        run: bash setup_sdk.sh

      - name: Configure Linux Release (no copyrighted XBE required)
        run: cmake --preset linux-release -DSUFFERING_ALLOW_NO_XBE=ON

      - name: Build Native Linux ELF64 host & compiler tools
        run: cmake --build out/build/linux-release --parallel

      - name: Package Native Linux & Steam Deck tarball
        run: |
          bash release_linux.sh \
            --build-dir out/build/linux-release \
            --out-tar .local/dist/TheSuffering-Recomp-v1.6.1-linux-x86_64.tar.gz

      - name: Headless Pre-Game Launcher smoke test (Xvfb + lavapipe)
        run: |
          mkdir -p .local/ci_smoke
          tar -xzf .local/dist/TheSuffering-Recomp-v1.6.1-linux-x86_64.tar.gz -C .local/ci_smoke
          SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 90 xvfb-run -a -s "-screen 0 1280x800x24" \
            .local/ci_smoke/suffering --launcher --capture-launcher-bmp .local/ci_launcher.bmp --launcher-exit
          test -s .local/ci_launcher.bmp
          ls -lh .local/ci_launcher.bmp

      - name: Run release hygiene & Linux ELF64 tarball audit
        run: |
          python3 -u tools/audit_release.py \
            --allow-remote --allow-dirty --skip-zips --skip-media \
            --linux-tar .local/dist/TheSuffering-Recomp-v1.6.1-linux-x86_64.tar.gz

      - name: Upload Linux x86_64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheSuffering-Recomp-v1.6.1-linux-x86_64
          path: .local/dist/TheSuffering-Recomp-v1.6.1-linux-x86_64.tar.gz
          retention-days: 14

  windows-x64:
    name: Windows x64 (MSVC + LLVM Clang + D3D12)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap & patch XboxXBERecomp SDK
        shell: cmd
        run: call setup_sdk.bat

      - name: Configure Windows x64 Release (no copyrighted XBE required)
        shell: cmd
        run: cmake --preset release -DSUFFERING_ALLOW_NO_XBE=ON

      - name: Build Windows x64 suffering.exe & compiler tools
        shell: cmd
        run: cmake --build out/build/release --parallel

      - name: Verify Windows executable & run repository hygiene audit
        shell: pwsh
        run: |
          if (!(Test-Path out/build/release/suffering.exe)) { throw "suffering.exe missing!" }
          python -u tools/audit_release.py --allow-remote --allow-dirty --skip-zips --skip-linux-tar --skip-media

      - name: Upload Windows x64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheSuffering-Recomp-v1.6.1-win64-ci
          path: out/build/release/suffering.exe
          retention-days: 14
